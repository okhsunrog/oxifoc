[package]
name = "oxifoc-g4"
version = "0.1.0"
edition = "2024"
description = "Shared hardware abstraction for STM32G4-based motor controllers"

[lib]
test = false
bench = false

[dependencies]
# Embassy dependencies - NO chip feature; consuming crate provides it via feature unification
embassy-stm32 = { git = "https://github.com/okhsunrog/embassy", rev = "3bc1758", features = ["unstable-pac"] }
embassy-sync = { git = "https://github.com/okhsunrog/embassy", rev = "3bc1758" }
embassy-time = { git = "https://github.com/okhsunrog/embassy", rev = "3bc1758", features = ["tick-hz-32_768"] }

# Cortex-M dependencies
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
critical-section = "1.2"

# Debugging and logging
defmt = "1.0.1"

# Local dependencies
oxifoc-core = { path = "../oxifoc-core", features = ["runtime", "defmt"] }

embedded-io-async = "0.7"
heapless = { version = "0.9.2", default-features = false }
