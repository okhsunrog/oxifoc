[package]
name = "oxifoc-g431"
version = "0.1.0"
edition = "2024"
description = "STM32G431-based motor controller (B-G431B-ESC1 board)"

[[bin]]
name = "oxifoc-g431"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["transport-uart"]
# UART over ST-Link VCP: ergot over serial, defmt over RTT + network forwarding
transport-uart = ["ergot/defmt-sink-network"]
# RTT via debug probe: ergot over RTT channels, defmt over separate RTT channel
transport-rtt = ["ergot/rtt"]

[dependencies]
# Embassy dependencies
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.4.0", features = ["memory-x", "stm32g431cb", "time-driver-tim2", "unstable-pac"] }
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["tick-hz-32_768"] }

# Cortex-M dependencies
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"

# Debugging and logging
defmt = "1.0.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Serialization
serde = { version = "1.0.219", features = ["derive"], default-features = false }
postcard-schema = "0.2.5"

# Synchronization
mutex = "1.0.2"

# Local dependencies
# runtime feature includes icd (endpoints) and types (shared structs)
oxifoc-core = { path = "../oxifoc-core", features = ["runtime", "defmt"] }
# Base ergot features: embedded-io-async + defmt to RTT (both modes need this)
# transport-uart adds: defmt-sink-network (for network forwarding)
# transport-rtt adds: rtt (for RTT transport wrappers)
ergot = { path = "../ergot/crates/ergot", default-features = false, features = [
    "embedded-io-async-v0_6",
    "disable-cache-padding",
    "defmt-sink-rtt",
] }

static_cell = "2.1"
assign-resources = "0.5.0"
embedded-io-async = "0.6"
heapless = { version = "0.9.2", default-features = false }
libm = { version = "0.2.15", default-features = false }

[profile.dev]
debug = true
lto = true
opt-level = "z"
incremental = true

[profile.release]
debug = 2
lto = true
opt-level = "z"
incremental = true

[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "5b03773" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "5b03773" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "5b03773" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "5b03773" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "5b03773" }
