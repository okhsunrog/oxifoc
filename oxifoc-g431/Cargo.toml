[package]
name = "oxifoc-g431"
version = "0.1.0"
edition = "2024"
description = "STM32G431-based motor controller (B-G431B-ESC1 board)"

[[bin]]
name = "oxifoc-g431"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["transport-uart", "detection"]
# UART over ST-Link VCP: ergot over serial, defmt over RTT + network forwarding
transport-uart = ["ergot/defmt-sink-network"]
# RTT via debug probe: ergot over RTT channels, defmt over separate RTT channel
transport-rtt = ["ergot/rtt"]
# On-device motor detection (detect server + calibration sweeps). Default-on;
# turning it off is a measured −15.5 KB reserve (docs/flash-size.md).
detection = ["oxifoc-core/detection"]

[dependencies]
# Embassy dependencies
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32g431cb", "time-driver-tim2", "unstable-pac", "defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768", "defmt"] }

# Cortex-M dependencies
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"

# Debugging and logging
defmt = "1.0.1"

# Serialization
serde = { version = "1.0.219", features = ["derive"], default-features = false }
postcard-schema = "0.2.5"

# Synchronization
mutex = "1.0.2"

# Local dependencies
# runtime feature includes icd (endpoints) and types (shared structs)
oxifoc-core = { path = "../oxifoc-core", default-features = false, features = ["algorithms", "runtime", "defmt", "storage", "embassy", "cordic", "delivery"] }
# Base ergot features: embedded-io-async + defmt to RTT (both modes need this)
# transport-uart adds: defmt-sink-network (for network forwarding)
# transport-rtt adds: rtt (for RTT transport wrappers)
ergot = { git = "https://github.com/jamesmunns/ergot", rev = "c3b31bf10a32ef94485fa460015acb5023a0044b", default-features = false, features = [
    "embedded-io-async-v0_7",
    "nostd-seed-router",
    "embassy-time",
    "disable-cache-padding",
    "defmt-sink-rtt",
] }

static_cell = "2.1"
assign-resources = "0.5.0"
embedded-io-async = { version = "0.7", features = ["defmt"] }
heapless = { version = "0.9.2", default-features = false, features = ["defmt"] }
libm = { version = "0.2.15", default-features = false }

postcard = { version = "1.1", features = ["use-defmt"] }
rtt-target = "0.6"


[profile.dev]
debug = true
lto = "fat"
opt-level = "z"
incremental = true

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = "z"
incremental = true

# Verbatim copy of the root [workspace.lints] tables (this crate is excluded
# from the workspace for its target/toolchain) — keep in sync with ../Cargo.toml.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"
# Firmware panic policy (matches the #![warn] block in oxifoc-core/src/lib.rs;
# deliberate fail-fast sites carry #[expect(..., reason = "...")]):
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
