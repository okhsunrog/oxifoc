[build]
target = "thumbv7em-none-eabihf"

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
linker = "flip-link"

[target.thumbv7em-none-eabihf]
runner = ["bash", "../scripts/probe_run.sh"]
rustflags = ["-C", "target-feature=+vfp2,-fp64"]

[env]
# Show all defmt levels unless overridden
DEFMT_LOG = "info"
