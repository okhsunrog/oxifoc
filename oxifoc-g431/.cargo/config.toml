[build]
target = "thumbv7em-none-eabihf"

# flip-link removed (2026-07-06): the stack lives in its own CCM region now
# (memory.x `_stack_start`), which gives the same overflow protection in
# hardware — nothing is mapped below CCM, so running off the bottom is a
# BusFault. flip-link would try to relocate the stack back into the 22K RAM
# statics region (56 bytes free) and brick the boot.

[target.thumbv7em-none-eabihf]
runner = ["bash", "../scripts/probe_run.sh"]
# DO NOT REMOVE these target features:
#  +vfp2  — required by the `sreg` register class in oxifoc-core's q31 inline asm
#  -fp64  — without it LLVM emits double-precision FPU instructions the
#           FPv4-SP-D16 FPU doesn't support, and the board hangs at runtime
rustflags = ["-C", "target-feature=+vfp2,-fp64"]

[env]
# Show all defmt levels unless overridden
DEFMT_LOG = "debug"

# Rebuild libcore with this profile's opt-level="z" + LTO instead of the
# shipped opt-level=3 build — saves flash on the 128K part. Requires the
# rust-src component (already in rust-toolchain.toml).
[unstable]
build-std = ["core"]
