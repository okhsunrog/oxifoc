[package]
name = "oxifoc-wire-sizes"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Encoded sizes and CAN frame counts of the OxiFOC ICD and ergot's control plane"
publish = false

[dependencies]
oxifoc-core = { workspace = true, features = ["icd", "storage", "delivery"] }
ergot = { workspace = true, features = ["std"] }
clap = { workspace = true }
serde = { workspace = true }
postcard = { version = "1.1.3", features = ["use-std"] }
postcard-schema = { version = "0.2.5", features = ["derive", "heapless-v0_9", "use-std"] }
heapless = { version = "0.9", features = ["serde"] }

[lints]
workspace = true
