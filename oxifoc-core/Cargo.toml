[package]
name = "oxifoc-core"
version = "0.1.0"
edition = "2024"
description = "Platform-agnostic FOC (Field-Oriented Control) algorithms and motor control logic"

[dependencies]
# Math library for no_std (sin, cos, sqrt, etc)
libm = { version = "0.2.15", default-features = false }

# Optional defmt support for embedded logging
defmt = { version = "1.0", optional = true }

# Optional log support for std logging
log = { version = "0.4", optional = true }

# Optional FFT for inductance measurement via HFI
microfft = { version = "0.6", optional = true }

[dev-dependencies]
# std is available during tests

[lib]
name = "oxifoc_core"
path = "src/lib.rs"

[features]
default = []
std = []
defmt = ["dep:defmt"]
log = ["dep:log"]
microfft = ["dep:microfft"]
