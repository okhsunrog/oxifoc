[package]
name = "oxifoc-core"
version = "0.1.0"
edition = "2024"
description = "Platform-agnostic FOC (Field-Oriented Control) algorithms and motor control logic"

[dependencies]
# Math library for no_std (sin, cos, sqrt, etc)
libm = { version = "0.2.15", default-features = false }

# no_std data structures
heapless = { version = "0.9", default-features = false, features = ["serde"] }

# Optional defmt support for embedded logging
defmt = { version = "1.0", optional = true }

# Optional log support for std logging
log = { version = "0.4", optional = true }

# FFT for inductance measurement via HFI (required for detection)
# Only size-32 needed (28 bytes sine table vs 4KB default). No bitrev-tables
# since Cortex-M4 has hardware RBIT instruction.
microfft = { version = "0.6", default-features = false, features = ["size-32"], optional = true }

# Optional persistent storage
sequential-storage = { version = "7.1", default-features = false, features = ["postcard"], optional = true }

# Serialization (always required for shared types)
serde = { version = "1.0", default-features = false, features = ["derive"] }
postcard-schema = { version = "0.2.5", features = ["derive", "heapless-v0_9"] }

# Ergot protocol framework (for icd feature)
ergot = { workspace = true, optional = true }

# Async runtime support (for runtime feature)
embassy-time = { version = "0.5.1", optional = true }
embassy-sync = { version = "0.8.0", optional = true }
embassy-futures = { version = "0.1.2", optional = true }
critical-section = { version = "1.2", optional = true }

# Embassy HAL support (for embassy-hal feature) — NO chip feature; consuming crate provides it
embassy-stm32 = { version = "0.6.0", features = ["unstable-pac"], optional = true }
embedded-io-async = { version = "0.7", optional = true }

# Lock-free queue for ISR → async telemetry transfer (runtime feature)
bbqueue = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
bitflags = { version = "2", default-features = false, features = ["serde"] }
embedded-storage-async = { version = "0.4", optional = true }
cortex-m = { version = "0.7.7", optional = true }

[dev-dependencies]
postcard = "1.1.3"
# std is available during tests

[lib]
name = "oxifoc_core"
path = "src/lib.rs"

[features]
default = ["algorithms", "detection", "offset-diagnostics"]

# Runtime current-offset comparison (undriven / per-phase / all-phases).
# Boot calibration remains unconditional; flash-tight devices can omit this
# host-triggered path and enable it only in a bench build.
offset-diagnostics = []

# Motor parameter detection: R/L/λ measurement sweeps, HFI inductance (FFT),
# voltage-pulse fallback and the shared async detect
# server (`runtime::detect`, when `delivery`+`storage` are also on).
# Default-on; flash-constrained builds can opt out (measured −14.7 KB on
# G431). `detection::types` and `detection::pi_tuning` stay available
# unconditionally — wire types and PI math are used outside detection.
# embassy-futures: runtime-agnostic `select` for the telemetry-sampling
# timeout in `measure_resistance`.
detection = ["algorithms", "dep:embassy-futures"]

# Speed-optimize the 20 kHz ISR hot path per-function (nightly
# `optimize_attribute`): the hot path is generic and monomorphizes into the
# size-optimized device crates, where opt-level "z" machine-outlines the
# ISR into cross-calls and memcpy'd struct returns (tier-3 PC sampling,
# 2026-07-07). Device crates enable this; host builds don't need it.
isr-speed = []

# Bench estimator forensics: repurpose three fast-frame columns with
# observer internals (velocity/erpm <- PLL omega-hat, angle <- phase_pll,
# vd <- instantaneous PLL error). Wire format unchanged — the capture just
# has to be read with the mapping in mind. Debug builds only.
obs-debug-telem = []

# Runtime HFI sensorless observer (carrier injection + synchronous demod for
# low/zero-speed commutation on salient motors). Independent of `hfi-detect`
# (that's the one-time inductance measurement). Off on non-salient boards
# (drone ESCs like B-G431B-ESC1) — the `PhaseSource` enum keeps its Hfi*
# variants for wire compatibility, but commanding one is rejected at runtime
# (`PhaseSourceError::HfiNotConfigured`).
hfi = []

# HFI-based inductance/saliency detection: rotating HF injection + FFT
# (microfft). Builds on `detection`. When off, `measure_inductance_auto`
# uses the voltage-pulse method only — wanted on non-salient boards (drone
# outrunners) and to drop the FFT on flash-tight boards (g431).
hfi-detect = ["detection", "dep:microfft"]

# Bench experiment: replace the inductance step with a one-lock R(f)/L(f)
# frequency sweep (`measure_impedance_sweep`), logging the complex impedance at
# each carrier frequency over RTT. Reuses the HFI lock/probe/current-budget, so
# it builds on `hfi-detect`. Off in all shipping builds — debug/characterization
# only (overlay against a bench LCR sweep).
impedance-sweep = ["hfi-detect"]

# Interface Control Document - ergot endpoints and wire types
icd = ["dep:ergot"]

# Delivery semantics — typed at-most/at-least/effectively-once ladder over ergot.
# Contract + pure retry policy + server-side dedup. The client driver is generic
# over `timer::Timer`, so it works on host (tokio) and device (embassy) alike.
# embassy-futures is used only for its runtime-agnostic `select` (per-attempt timeout).
delivery = ["icd", "dep:embassy-futures"]

# FOC algorithms (transforms, SVPWM, PI controllers, etc.)
# This is the core motor control math, no extra dependencies
algorithms = []

# Pod (bytemuck) views of the wire types — FastTelemetry raw-byte batches.
# Host crates that only decode telemetry want this without the whole runtime.
pod = ["dep:bytemuck"]

# Async runtime with state management and protocol servers
# Requires icd for endpoints and algorithms for control logic
runtime = ["icd", "algorithms", "pod", "dep:embassy-sync", "dep:embassy-futures", "dep:critical-section", "dep:bbqueue"]

# Virtual motor simulation for testing without hardware
# Useful for host-side integration tests and GUI simulation mode
virtual-motor = []

# std support (enables std-dependent features)
std = ["critical-section?/std"]

# defmt support for embedded logging
defmt = ["dep:defmt", "heapless/defmt"]
# Per-section DWT cycle counters inside the shared ISR path (run_foc_cycle /
# FocDriver::step) — device-only (reads the Cortex-M DWT directly). ~30
# cycles of overhead per ISR; the platform stats task reports the sums.
isr-profiling = ["dep:cortex-m"]

# log crate support for std logging
log = ["dep:log"]

# Persistent configuration storage
storage = ["dep:sequential-storage", "dep:embedded-storage-async"]

# Embassy async support (timer, current sensor calibration, hall state management)
embassy = ["dep:embassy-time", "dep:embassy-sync", "dep:critical-section"]

# Embassy HAL support (UART I/O wrappers, requires embassy-stm32 chip feature from consuming crate)
embassy-hal = ["embassy", "dep:embassy-stm32", "dep:embedded-io-async"]

# CORDIC hardware sin/cos (requires embassy-stm32 CORDIC driver)
cordic = ["embassy-hal"]
embedded-storage-async = ["dep:embedded-storage-async"]
cortex-m = ["dep:cortex-m"]

[[example]]
name = "detection_report"
required-features = ["virtual-motor", "std", "detection"]

[lints]
workspace = true
