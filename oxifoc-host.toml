# oxifoc-host configuration (TOML)

# Optional: select a specific probe (VID:PID[:SERIAL])
# probe = "0483:374b:0668FF555567894967074721"

# Optional: explicit chip name (otherwise auto-detect)
chip = "STM32G431CBTx"

# Optional: path to device ELF for defmt decoding
elf = "oxifoc-g431/target/thumbv7em-none-eabihf/release/oxifoc-g431"

# Serial transport (ST-LINK VCP -> USART2)
serial_path = "/dev/ttyACM0"
serial_baud = 921600

# Toggle streaming
stream_defmt = true
stream_ergot = true
