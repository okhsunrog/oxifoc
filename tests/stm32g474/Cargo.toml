[package]
name = "oxifoc-tests-g474"
version = "0.1.0"
edition = "2024"

[[test]]
name = "foc"
harness = false

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["stm32g474re", "time-driver-any", "unstable-pac", "dual-bank"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93", version = "0.5.1" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93", version = "0.8.0" }

cortex-m = { version = "0.7.8", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.6"

defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embedded-test = { version = "0.7", features = ["defmt", "external-executor", "embassy"] }
libm = { version = "0.2", default-features = false }

oxifoc-core = { path = "../../oxifoc-core", features = ["defmt", "algorithms", "cordic"] }

[profile.dev]
debug = true
lto = "fat"
opt-level = 3
incremental = true

[profile.release]
debug = 2
lto = "fat"
opt-level = 3
incremental = true

# Verbatim copy of the root [workspace.lints] tables (this crate is excluded
# from the workspace for its target/toolchain) — keep in sync with ../Cargo.toml.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"
