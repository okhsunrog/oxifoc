[package]
name = "oxifoc-tests-g431"
version = "0.1.0"
edition = "2024"

[[test]]
name = "foc"
harness = false

[dependencies]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", features = ["stm32g431cb", "time-driver-any", "unstable-pac"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embedded-test = { version = "0.7", features = ["defmt", "external-executor", "embassy"] }
libm = { version = "0.2", default-features = false }

oxifoc-core = { path = "../../oxifoc-core", features = ["defmt", "algorithms"] }
oxifoc-g4 = { path = "../../oxifoc-g4" }

[profile.dev]
debug = true
lto = "fat"
opt-level = "s"
incremental = true

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
incremental = true

[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
