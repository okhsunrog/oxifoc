[package]
name = "oxifoc-tests-f405"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[[test]]
name = "foc"
harness = false

[[test]]
name = "logging"
harness = false

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["stm32f405rg", "time-driver-any", "unstable-pac"], git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8", version = "0.5.1" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8", version = "0.8.0" }

cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"

defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
libm = { version = "0.2", default-features = false }

oxifoc-core = { path = "../../oxifoc-core", features = ["defmt", "algorithms", "embassy"], version = "0.1.0" }
rtt-target = { version = "0.6", default-features = false }
bbqueue = { version = "0.7", default-features = false, features = ["maitake-sync-0_3", "disable-cache-padding"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8", version = "0.1.2" }
embedded-test = { version = "0.7.3", features = ["defmt", "external-executor", "embassy-010", "panic-handler"] }

[features]
bench-hall-single-turn = ["oxifoc-core/bench-hall-single-turn"]
bench-hall-bit-step = ["bench-hall-single-turn", "oxifoc-core/bench-hall-bit-step"]
lean-angle = ["oxifoc-core/lean-angle"]

[profile.dev]
debug = true
lto = "fat"
opt-level = 3
incremental = true

[patch.crates-io]
rtt-target = { path = "../../vendor/rtt-target" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }

[profile.release]
debug = 2
lto = "fat"
opt-level = 3
incremental = true

# Verbatim copy of the root [workspace.lints] tables (this crate is excluded
# from the workspace for its target/toolchain) — keep in sync with ../Cargo.toml.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"
