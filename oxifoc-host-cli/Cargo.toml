[package]
name = "oxifoc-host-cli"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
oxifoc-host-lib = { path = "../oxifoc-host-lib" }
oxifoc-core = { workspace = true, features = ["icd", "bridge-ota-auth"] }
anyhow = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
serde_json = "1.0.154"
parquet = { version = "60.1.0", default-features = false, features = ["zstd"] }
serde = { workspace = true, features = ["derive"] }
sha2 = { version = "0.11", default-features = false }
heapless = "0.9"

[lints]
workspace = true
