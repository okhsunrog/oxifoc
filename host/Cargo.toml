[package]
name = "oxifoc-host"
version = "0.1.0"
edition = "2024"

[dependencies]
# Protocol shared with device
oxifoc-protocol = { path = "../protocol" }

# Ergot for host side
ergot = { path = "../ergot/crates/ergot", features = ["tokio-std", "tokio-serial-v5", "defmt-network"] }

# Async runtime
tokio = { version = "1.45", features = ["full"] }
tokio-serial = "5.4.4"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"

# Utilities
anyhow = "1.0"
mutex = "1.0.2"

cobs-acc = { path = "../ergot/crates/cobs-acc", features = ["std"] }

# Decode defmt frames from RTT using device ELF
defmt-decoder = "1.0"

# Config loading (TOML)
serde = { version = "1", features = ["derive"] }
toml = "0.9"
eframe = "0.33.2"
egui_plot = "0.34.0"
crossbeam-channel = "0.5.15"
