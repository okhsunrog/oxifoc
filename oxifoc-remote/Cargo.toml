[package]
edition      = "2024"
rust-version = "1.100"
name         = "oxifoc-remote"
version      = "0.1.0"
default-run  = "oxifoc-remote"

[[bin]]
name = "oxifoc-remote"
path = "./src/bin/main.rs"
test = false
bench = false

[[test]]
harness = false
name    = "hello_test"

[lib]
test = false
bench = false

[dependencies]

defmt = "1.2.0"
embassy-executor = { version = "0.10", features = ["defmt", "executor-thread", "platform-cortex-m"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
ergot = { git = "https://github.com/okhsunrog/ergot", rev = "ef3ffa6a4dbbe6929f272a91f72fda44c90d779a", version = "0.12.0", default-features = false, features = ["embassy-time", "disable-cache-padding", "defmt-v1"] }
mutex = "1.0.2"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
postcard-schema = "0.2.5"
embassy-futures = "0.1.2"
bbqueue = "0.7"
bt-hci = "0.11"
heapless = { version = "0.9", default-features = false }
oxifoc-core = { version = "0.1.0", path = "../oxifoc-core", default-features = false, features = ["icd", "defmt"] }
cortex-m-rt = { version = "0.7.7", features = ["set-vtor"] }
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "unstable-pac", "defmt"] }
nrf-mpsl = { version = "0.4.0", default-features = false, features = ["critical-section-impl", "defmt"], git = "https://github.com/alexmoon/nrf-sdc.git", rev = "383afedd40964b31313cc983ff3aaf7c2e74e188" }
nrf-sdc = { version = "0.4.0", default-features = false, features = ["nrf52840", "central", "peripheral", "defmt"], git = "https://github.com/alexmoon/nrf-sdc.git", rev = "383afedd40964b31313cc983ff3aaf7c2e74e188" }
embedded-graphics = "0.8.2"
ssd1306 = { version = "0.10.0", default-features = false, features = ["async", "graphics"] }
trouble-host = { version = "0.8.0", default-features = false, features = ["central", "gatt", "default-packet-pool-mtu-512", "defmt", "security"], git = "https://github.com/embassy-rs/trouble.git", rev = "da44b34f67e1ee8efe977a5a975804b8b21962d4" }
embassy-sync = "0.8"
sequential-storage = { version = "8.0", features = ["postcard", "defmt"] }
# Crypto backend for trouble's Security Manager (same embassy rev as trouble).
embassy-crypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c" }
# AES-128-CMAC is our own driver (src/csprng.rs): rustcrypto's CMAC state does
# not fit embassy-crypto's opaque context on Cortex-M.
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c", features = [
  "embassy-crypto-aes128-ecb",
  "embassy-crypto-p256-ecdh",
] }
rand_chacha = { version = "0.3", default-features = false }

[dev-dependencies]
embedded-test = { version = "0.7.3", features = ["defmt", "embassy-010", "external-executor"] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

# Verbatim copy of the root [workspace.lints] tables (this crate is excluded
# from the workspace for its target/toolchain) — keep in sync with ../Cargo.toml.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"
# Firmware panic policy (matches the #![warn] block in oxifoc-core/src/lib.rs;
# deliberate fail-fast sites carry #[expect(..., reason = "...")]):
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
