[package]
edition      = "2024"
name         = "oxifoc-remote"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "oxifoc-remote"
path = "./src/bin/main.rs"
test = false
bench = false

[[test]]
harness = false
name    = "hello_test"

[lib]
test = false
bench = false

[dependencies]
esp-hal = { features = ["defmt", "esp32c6", "unstable"], version = "1.2.2" }

esp-rtos = { features = ["defmt", "embassy", "esp-alloc", "esp-radio", "esp32c6"], version = "0.4.0" }

defmt = "1.1.1"
esp-bootloader-esp-idf = { features = ["defmt", "esp32c6"], version = "0.6.0" }

bt-hci = "0.11"
embassy-executor = { version = "0.10", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { features = ["defmt"], version = "0.11.0" }
esp-radio = { features = ["ble", "defmt", "esp-alloc", "esp32c6", "unstable"], version = "=1.0.0-beta.1" }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
trouble-host = { features = ["gatt"], version = "0.8.0", git = "https://github.com/embassy-rs/trouble.git", rev = "042bd1c3bdc5980f66d28e0e698b6e579b15da4e" }

critical-section = "1.2.0"
static_cell      = "2.1.1"
ergot = { git = "https://github.com/okhsunrog/ergot", rev = "3c502f49814ac2ae25385b21fdbc9b964f86d877", version = "0.12.0", default-features = false, features = ["embassy-time", "disable-cache-padding", "defmt-v1"] }
mutex = "1.0.2"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
postcard-schema = "0.2.5"
embassy-futures = "0.1.2"
bbqueue = "0.7"
heapless = { version = "0.9", default-features = false }
oxifoc-core = { version = "0.1.0", path = "../oxifoc-core", features = ["icd", "defmt"] }

[dev-dependencies]
embedded-test = { version = "0.7.3", features = ["defmt", "embassy-010", "external-executor"] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

# Verbatim copy of the root [workspace.lints] tables (this crate is excluded
# from the workspace for its target/toolchain) — keep in sync with ../Cargo.toml.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"
# Firmware panic policy (matches the #![warn] block in oxifoc-core/src/lib.rs;
# deliberate fail-fast sites carry #[expect(..., reason = "...")]):
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
