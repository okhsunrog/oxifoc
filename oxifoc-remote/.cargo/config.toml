[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip nRF52840_xxAA --preverify --always-print-stacktrace --no-location"

[env]
DEFMT_LOG = "info"
# Generate the Nordic bindings for bare metal without using host libc headers.
BINDGEN_EXTRA_CLANG_ARGS_thumbv7em_none_eabihf = "-ffreestanding"

[build]
target = "thumbv7em-none-eabihf"
