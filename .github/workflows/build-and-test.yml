name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # A stale git rev in one of the ~10 excluded-crate lock files once
      # survived unnoticed until an on-target build failed; check directly.
      - name: git-rev sync across lock files
        run: python3 scripts/check-git-rev-sync.py

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: install device toolchains
        run: |
          for crate in oxifoc-g474 oxifoc-f405 oxifoc-bridge oxifoc-remote; do
            channel=$(grep '^channel' "$crate/rust-toolchain.toml" | sed 's/.*= *"\(.*\)"/\1/')
            rustup toolchain install "$channel" --component rustfmt
          done

      - name: format check (workspace)
        run: cargo fmt --check --all

      - name: format check (device crates)
        run: |
          for crate in oxifoc-g474 oxifoc-f405 oxifoc-bridge oxifoc-remote; do
            (cd "$crate" && cargo fmt --check)
          done

      - name: format check (on-target test crates)
        run: |
          for crate in tests/stm32g474 tests/stm32f405; do
            (cd "$crate" && cargo fmt --check)
          done

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libfontconfig-dev libdbus-1-dev pkg-config

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy (workspace)
        # --locked: git deps are pinned to revs; never let CI silently re-resolve.
        # --all-targets: lint tests/examples/benches too, not just lib+bins.
        run: cargo clippy --workspace --all-targets --locked --quiet -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libfontconfig-dev libdbus-1-dev pkg-config

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: tests
        run: cargo test --workspace --locked

      - name: oxifoc-core with HFI features (hfi + hfi-detect)
        # The Hfi* runtime observer and the FFT inductance path are behind
        # features off by default; the workspace pass above runs without them.
        # Without this, the gated tests (HFI estimator / crossovers, the
        # inductance module, run_full_detection_high_r_low_vbus and
        # _nonideal_plant_with_delay) would never run.
        run: >
          cargo test -p oxifoc-core --locked
          --features runtime,virtual-motor,storage,std,delivery,hfi,hfi-detect

      - name: oxifoc-core without detection (feature gate must not rot)
        # Mirrors the check in `just check-host`. No build disables the
        # default-on `detection` feature yet, so without this the gated-off
        # configuration would only ever be compiled here.
        run: >
          cargo check -p oxifoc-core --locked --no-default-features
          --features algorithms,runtime,storage,delivery,defmt,embassy,virtual-motor,std

  device:
    strategy:
      fail-fast: false
      matrix:
        target: [oxifoc-g474, oxifoc-f405]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6

      - name: read toolchain channel
        id: toolchain
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: thumbv7em-none-eabihf
          components: clippy, llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.target }}

      - name: install cargo-binutils and flip-link
        run: cargo install cargo-binutils flip-link

      - name: clippy
        run: cargo clippy --all-targets --locked --quiet -- -D warnings

      - name: build release
        run: cargo build --release --locked

      - name: check for bloated symbols
        run: ../scripts/check_bloat.sh

      - name: compile on-target tests
        # Can't run without hardware, but compiling keeps them from rotting
        # (a stale ergot rev once survived in their lockfile unnoticed).
        working-directory: ${{ github.workspace }}
        run: |
          chip="${{ matrix.target }}"
          cd "tests/stm32${chip#oxifoc-}" && cargo build --tests --locked

  device-esp:
    strategy:
      fail-fast: false
      matrix:
        target: [oxifoc-bridge, oxifoc-remote]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6

      - name: read toolchain channel
        id: toolchain
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: riscv32imac-unknown-none-elf
          components: clippy, llvm-tools, rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.target }}

      - name: install cargo-binutils
        run: cargo install cargo-binutils

      - name: clippy
        run: cargo clippy --all-targets --locked --quiet -- -D warnings

      - name: build release
        run: cargo build --release --locked

      - name: check for bloated symbols
        run: ../scripts/check_bloat.sh
