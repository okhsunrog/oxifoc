name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: install device toolchains
        run: |
          for crate in oxifoc-g431 oxifoc-g474 oxifoc-f405; do
            channel=$(grep '^channel' "$crate/rust-toolchain.toml" | sed 's/.*= *"\(.*\)"/\1/')
            rustup toolchain install "$channel" --target thumbv7em-none-eabihf --component rustfmt
          done

      - name: format check (workspace)
        run: cargo fmt --check --all

      - name: format check (device crates)
        run: |
          for crate in oxifoc-g431 oxifoc-g474 oxifoc-f405; do
            (cd "$crate" && cargo fmt --check)
          done

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libfontconfig-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy (workspace)
        run: cargo clippy --workspace --quiet -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libfontconfig-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: tests
        run: cargo test --workspace

  device:
    strategy:
      fail-fast: false
      matrix:
        target: [oxifoc-g431, oxifoc-g474, oxifoc-f405]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: read toolchain channel
        id: toolchain
        run: |
          channel=$(grep '^channel' rust-toolchain.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: thumbv7em-none-eabihf
          components: clippy, llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.target }}

      - name: install cargo-binutils
        run: cargo install cargo-binutils

      - name: clippy
        run: cargo clippy --quiet -- -D warnings

      - name: build release
        run: cargo build --release

      - name: check for bloated symbols
        run: ../scripts/check_bloat.sh
