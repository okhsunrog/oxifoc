name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: install Rust nightly (device toolchain)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.89'
          targets: thumbv7em-none-eabihf
          components: rustfmt

      - name: format check (workspace)
        run: cargo fmt --check --all

      - name: format check (device crates)
        run: |
          for crate in oxifoc-g431 oxifoc-g474 oxifoc-f405; do
            (cd "$crate" && cargo +1.89 fmt --check)
          done

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libfontconfig-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy (workspace)
        run: cargo clippy --workspace --quiet -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libfontconfig-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: tests
        run: cargo test --workspace

  device:
    strategy:
      fail-fast: false
      matrix:
        target: [oxifoc-g431, oxifoc-g474, oxifoc-f405]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.89'
          targets: thumbv7em-none-eabihf
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.target }}

      - name: clippy
        run: cargo clippy --quiet -- -D warnings

      - name: build release
        run: cargo build --release
