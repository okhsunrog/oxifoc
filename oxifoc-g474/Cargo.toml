[package]
name = "oxifoc-g474"
version = "0.1.0"
edition = "2024"
description = "STM32G474-based motor controller (NUCLEO-G474RE board)"

[[bin]]
name = "oxifoc-g474"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Embassy dependencies (main branch with async flash support for G4)
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-futures = { version = "0.1.2" }
embassy-stm32 = { version = "0.6.0", features = ["stm32g474re", "time-driver-tim2", "unstable-pac", "dual-bank", "defmt"] }
embassy-sync = { version = "0.8.0" }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
embassy-usb = { version = "0.6.0" }

# Cortex-M dependencies
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"

# Debugging and logging
defmt = "1.0.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Serialization
serde = { version = "1.0.219", features = ["derive"], default-features = false }
postcard-schema = "0.2.5"

# Synchronization
mutex = "1.0.2"

# Local dependencies
# runtime feature includes icd (endpoints) and types (shared structs)
oxifoc-core = { path = "../oxifoc-core", features = ["runtime", "defmt", "storage", "embassy", "cordic", "embassy-hal"] }
ergot = { git = "https://github.com/okhsunrog/ergot", branch = "unified-router", default-features = false, features = [
    "embassy-usb-v0_6",
    "embedded-io-async-v0_7",
    "nostd-seed-router",
    "embassy-time",
    "disable-cache-padding",
    "defmt-sink-rtt",
] }

static_cell = "2.1"
assign-resources = "0.5.0"
embedded-io-async = "0.7"
heapless = { version = "0.9.2", default-features = false }
libm = { version = "0.2.15", default-features = false }

# Persistent configuration storage
sequential-storage = { version = "7.1", features = ["postcard", "defmt"] }
embedded-storage-async = "0.4"
embassy-embedded-hal = { version = "0.6.0" }
postcard = "1.1"
rtt-target = "0.6"

[profile.dev]
debug = true
lto = "fat"
opt-level = 3
incremental = true

[profile.release]
debug = 2
lto = "fat"
opt-level = 3
incremental = true
