[package]
name = "oxifoc-host-tauri"
version = "0.1.0"
description = "Oxifoc Tauri GUI"
authors = ["okhsunrog"]
edition = "2021"

[lib]
name = "oxifoc_host_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Path dependencies to sibling crates
oxifoc-host-lib = { path = "../../oxifoc-host-lib" }
oxifoc-protocol = { path = "../../protocol" }

# Workspace dependencies
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossbeam-channel = { workspace = true }

# Tauri-specific (keep pinned versions)
tauri = { version = "2", features = ["specta"] }
tauri-plugin-opener = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.22", features = ["serde", "serde_json", "derive"] }
specta-typescript = "0.0.9"
tauri-specta = { git = "https://github.com/specta-rs/tauri-specta", rev = "6fe9532", features = ["typescript", "derive"] }
