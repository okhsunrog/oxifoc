# Test code may unwrap/panic/dbg freely — these gate the firmware
# panic-policy lints (see oxifoc-core/src/lib.rs and the device-crate
# [lints] tables) out of #[test] / #[cfg(test)] scopes.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true

# large_futures starts mattering on a 32 KB-RAM MCU long before its 16 KB
# default; futures above this size deserve a look at what they hold across
# await points.
future-size-threshold = 2048
