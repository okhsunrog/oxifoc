[package]
name = "oxifoc-host-dioxus-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace]

[features]
desktop = ["oxifoc-host-lib/desktop"]

[dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "97adf7915e1adfef4e2da436c9bd0b6add0dfa39", version = "0.8.0-alpha.3", default-features = false, features = ["minimal"] }
oxifoc-host-lib = { version = "0.1.0", path = "../oxifoc-host-lib", default-features = false }
oxifoc-ui = { version = "0.1.0", path = "../oxifoc-ui" }
tokio = { version = "1.54.1", features = ["time", "rt", "sync"] }

[target.'cfg(target_os = "android")'.dependencies]
dioxus-blec = { git = "https://github.com/okhsunrog/tauri-plugin-blec", rev = "6c5f1b5b5e55ff79312e9564efb9a560cdc788ba", version = "0.20.0", features = ["android-webview"] }
