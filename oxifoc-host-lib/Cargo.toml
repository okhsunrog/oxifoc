[package]
name = "oxifoc-host-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
oxifoc-core = { path = "../oxifoc-core", features = ["icd"] }
ergot = { git = "https://github.com/jamesmunns/ergot", features = ["tokio-std", "tokio-serial-v5", "defmtlog"] }

tokio = { workspace = true }
tokio-util = "0.7"
tokio-serial = "5.4.4"
serialport = "4.7"  # For port enumeration

# RTT transport via probe-rs
probe-rs = "0.28"

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = "0.2"

anyhow = { workspace = true }
mutex = "1.0.2"
crossbeam-channel = { workspace = true }
cobs-acc = { git = "https://github.com/jamesmunns/ergot", features = ["std"] }
defmt-decoder = "1.0"
defmt-parser = "1.0"
serde = { workspace = true }
toml = "0.9"
