[package]
name = "oxifoc-host-lib"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[features]
default = ["desktop"]
# Only for the transport lifecycle regression test; never enable in a GUI.
ble-mock-tests = ["blec/mock"]
desktop = [
    "dep:probe-rs",
    "dep:tokio-serial",
    "ergot/tokio-serial-v5",
]

[dependencies]
oxifoc-core = { workspace = true, features = ["icd", "storage", "delivery"] }
ergot = { workspace = true, features = ["tokio-std", "nusb-v0_1", "defmtlog"] }

tokio = { workspace = true }
tokio-util = "0.7"

# Desktop-only transports
tokio-serial = { version = "5.5.0", optional = true }
probe-rs = { version = "0.32", optional = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = "0.2"

anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
defmt-decoder = "1.2"
defmt-parser = "1.1"
serde = { workspace = true }
toml = { workspace = true }
tokio-stream = "0.1.19"
bytes = "1.12.1"
serde_json = "1.0.154"
blec = { version = "0.20.0", git = "https://github.com/okhsunrog/tauri-plugin-blec", rev = "6c5f1b5b5e55ff79312e9564efb9a560cdc788ba" }
uuid = "1.29.2"

[lints]
workspace = true

[dev-dependencies]
btleplug = "0.13.5"
