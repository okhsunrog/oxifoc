[package]
name = "oxifoc-host-lib"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[features]
default = ["desktop"]
# Only for the transport lifecycle regression test; never enable in a GUI.
ble-mock-tests = ["blec/mock"]
transport-bench = ["oxifoc-core/transport-bench"]
desktop = [
    "dep:probe-rs",
    "dep:tokio-serial",
    "ergot/tokio-serial-v5",
]

[dependencies]
oxifoc-core = { workspace = true, features = ["icd", "storage", "delivery", "pod"] }
ergot = { workspace = true, features = ["tokio-std", "nusb-v0_1", "defmtlog"] }

tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }

# Desktop-only transports
tokio-serial = { version = "5.5.0", optional = true }
probe-rs = { version = "0.32", optional = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-log = "0.2"

anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
defmt-decoder = "1.2"
defmt-parser = "1.1"
serde = { workspace = true }
toml = { workspace = true }
tokio-stream = "0.1.19"
bytes = "1.12.1"
futures = "0.3.34"
serde_json = "1.0.154"
object = { version = "0.41.0", default-features = false, features = ["read"] }
nusb = "0.1"
blec = { version = "0.20.0", git = "https://github.com/okhsunrog/tauri-plugin-blec", rev = "6c5f1b5b5e55ff79312e9564efb9a560cdc788ba" }
uuid = "1.29.2"

[lints]
workspace = true

[[example]]
name = "velocity_cpu_control"
required-features = ["desktop"]

[[example]]
name = "usb_serial_jtag_bench"
required-features = ["desktop", "transport-bench"]

[dev-dependencies]
btleplug = "0.13.5"
