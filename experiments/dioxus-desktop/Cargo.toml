[package]
name = "oxifoc-desktop-plot-probe"
version = "0.1.0"
edition = "2024"
default-run = "oxifoc-desktop-plot-probe"

[workspace]

[dependencies]
dioxus = { git = "https://github.com/DioxusLabs/dioxus", rev = "97adf7915e1adfef4e2da436c9bd0b6add0dfa39", version = "0.8.0-alpha.3", default-features = false, features = ["minimal", "desktop", "document"] }
gtk = "0.18.2"
oxifoc-core = { version = "0.1.0", path = "../../oxifoc-core", features = ["std"] }
oxifoc-host-dioxus-ui = { version = "0.1.0", path = "../../oxifoc-host-dioxus-ui", features = ["desktop"] }
oxifoc-host-lib = { version = "0.1.0", path = "../../oxifoc-host-lib", default-features = false }
oxifoc-ui = { version = "0.1.0", path = "../../oxifoc-ui" }
serde_json = "1.0.154"
