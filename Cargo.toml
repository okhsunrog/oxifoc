[workspace]
resolver = "2"
members = [
    "oxifoc-core",
    "oxifoc-host-lib",
    "oxifoc-host-cli",
    "slint-wgpu-plot",
    "oxifoc-host-slint",
    "oxifoc-virtual",
]
exclude = [
    "oxifoc-g431",    # Different toolchain (thumbv7em-none-eabihf)
    "oxifoc-g474",    # Different toolchain (thumbv7em-none-eabihf)
    "oxifoc-f405",    # Different toolchain (thumbv7em-none-eabihf)
    "tests/stm32g431", # On-target integration tests
    "tests/stm32g474", # On-target integration tests
    "tests/stm32f405", # On-target integration tests
]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace.dependencies]
oxifoc-core = { path = "oxifoc-core" }
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1.0"
crossbeam-channel = "0.5.15"
clap = { version = "4.5", features = ["derive"] }
toml = "0.9"
slint = { git = "https://github.com/slint-ui/slint.git", default-features = false, features = ["std", "unstable-wgpu-28", "compat-1-2"] }
slint-build = { git = "https://github.com/slint-ui/slint.git" }
bytemuck = { version = "1", features = ["derive"] }
