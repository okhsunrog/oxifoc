[workspace]
resolver = "2"
members = [
    "oxifoc-core",
    "oxifoc-host-lib",
    "oxifoc-host-cli",
    "slint-wgpu-plot",
    "oxifoc-host-slint",
    "oxifoc-virtual",
]
exclude = [
    "oxifoc-g474",    # Different toolchain (thumbv7em-none-eabihf)
    "oxifoc-f405",    # Different toolchain (thumbv7em-none-eabihf)
    "oxifoc-bridge",  # Different toolchain (riscv32imac-unknown-none-elf, ESP32-C6)
    "oxifoc-remote",  # Different toolchain (riscv32imac-unknown-none-elf, ESP32-C6)
    "tests/stm32g474", # On-target integration tests
    "tests/stm32f405", # On-target integration tests
]

# Curated strict lints; members opt in via `[lints] workspace = true`.
# The excluded device crates (oxifoc-g474/f405, bridge, remote, tests/*)
# carry a verbatim copy of these tables — keep them in sync when editing.
[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace.dependencies]
oxifoc-core = { path = "oxifoc-core" }
# Git deps are pinned to revs for reproducible builds (CI runs with --locked).
# To bump: update the rev here AND in the excluded device crates' Cargo.toml
# (oxifoc-g474/f405/bridge/remote), then refresh all Cargo.lock files.
# ergot rev = upstream main HEAD 2026-08-06 (edge_link_local ctor +
# revert-to-link-local liveness policy + the #217 soundness batch)
ergot = { git = "https://github.com/okhsunrog/ergot", rev = "5a5fab8234339ecdc252e18c41ef2676bd6bb091" }
tokio = { version = "1.45", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1.0"
crossbeam-channel = "0.5.15"
clap = { version = "4.5", features = ["derive"] }
toml = "0.9"
slint = { version = "1.17.0", default-features = false, features = ["std", "unstable-wgpu-28", "compat-1-2"] }
wgpu = { version = "28", default-features = false, features = ["wgsl", "vulkan"] }
slint-build = "1.17.0"
bytemuck = { version = "1", features = ["derive"] }
bbqueue = "0.7"
