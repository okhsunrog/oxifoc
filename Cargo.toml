[workspace]
resolver = "2"
members = [
    "oxifoc-core",
    "oxifoc-host-lib",
    "oxifoc-host-cli",
    "oxifoc-host-slint",
    "oxifoc-virtual",
    "oxifoc-plot",
    "oxifoc-wire-sizes",
]
exclude = [
    "vendor/rtt-target", # Locally patched RTT transport, tested independently.
    "oxifoc-host-dioxus", # Experimental native dependency graph has its own lockfile.
    "oxifoc-g474",    # Different toolchain (thumbv7em-none-eabihf)
    "oxifoc-f405",    # Different toolchain (thumbv7em-none-eabihf)
    "oxifoc-bridge",  # Different toolchain (riscv32imac-unknown-none-elf, ESP32-C6)
    "oxifoc-remote",  # Different toolchain (thumbv7em-none-eabihf, nRF52840)
    "tests/stm32g474", # On-target integration tests
    "tests/stm32f405", # On-target integration tests
]

[workspace.package]
# Minimum supported Rust; the host toolchain is pinned to the same release in
# rust-toolchain.toml. core::mem::DropGuard is stable since 1.100.
rust-version = "1.100"

# Curated strict lints; members opt in via `[lints] workspace = true`.
# The excluded device crates (oxifoc-g474/f405, bridge, remote, tests/*)
# carry a verbatim copy of these tables — keep them in sync when editing.
[workspace.lints.rust]
unused_qualifications = "warn"

[workspace.lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace.dependencies]
oxifoc-core = { path = "oxifoc-core" }
# Git deps are pinned to revs for reproducible builds (CI runs with --locked).
# To bump: update the rev here AND in the excluded device crates' Cargo.toml
# (oxifoc-g474/f405/bridge/remote), then refresh all Cargo.lock files.
# Pin: the fork branch can-transport (ergot #227, a draft) on top of ergot
# main at #247.
# Keep a fixed commit so capture provenance remains reproducible.
ergot = { git = "https://github.com/okhsunrog/ergot", rev = "c9d347c232d92a0a7dc7085e217b799a63006e30" }
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1.0"
crossbeam-channel = "0.5.17"
clap = { version = "4.6", features = ["derive"] }
toml = "1.2"
# Keep the runtime and compiler on the same release for WGPU 30 integration.
slint = { version = "=1.19.0", default-features = false, features = ["std", "unstable-wgpu-30", "compat-1-2"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan"] }
slint-build = "=1.19.0"
bytemuck = { version = "1", features = ["derive"] }
bbqueue = "0.7"

# Keep ergot's Embassy time dependency on the same main-branch revision as the
# optional STM32 HAL slice in oxifoc-core.
[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }
