[package]
edition      = "2024"
rust-version = "1.100"
name         = "oxifoc-bridge"
version      = "0.1.0"

[[bin]]
name = "oxifoc-bridge"
path = "./src/bin/main.rs"
test = false
bench = false

[[test]]
harness = false
name    = "hello_test"

[lib]
test = false
bench = false

[features]
default = []
ble = [
  "dep:esp-radio",
  "dep:embedded-storage",
  "dep:sequential-storage",
  "dep:embassy-embedded-hal",
  "dep:embassy-crypto",
  "dep:embassy-crypto-rustcrypto",
  "dep:rand_chacha",
  "trouble-host/security",
]
swd-probe = [
  "wifi",
  "dep:dap-rs",
  "dep:riscv",
]
wifi = [
  "dep:embassy-net",
  "dep:esp-radio",
  "embassy-executor/scheduler-priority",
  "esp-radio/coex",
  "esp-radio/wifi",
]
ota = ["dep:embedded-storage", "dep:sha2"]

[dependencies]
esp-hal = { features = ["log-04", "esp32c5", "unstable"], version = "1.2.0" }

esp-rtos = { features = ["log-04", "embassy", "esp-alloc", "esp-radio", "esp32c5"], version = "0.4.0" }

esp-bootloader-esp-idf = { features = ["log-04", "esp32c5", "embedded-storage"], version = "0.6.0" }

bt-hci = "0.11"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
embassy-sync = "0.8"
embedded-io = { version = "0.7.1" }
embedded-io-async = { version = "0.7.0" }
# The heap statistics feed `req/bridge_diag`.
esp-alloc = { version = "0.11.0", features = ["internal-heap-stats"] }
esp-radio = { features = ["ble", "log-04", "esp-alloc", "esp32c5", "unstable"], version = "1.0.0-beta.2", optional = true }
# Bond storage in the NVS partition (ble feature).
sequential-storage = { version = "8.0", features = ["postcard"], optional = true }
embassy-embedded-hal = { version = "0.6", optional = true }
# Crypto backend for trouble's Security Manager (same embassy rev as trouble).
embassy-crypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c", optional = true }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c", optional = true, features = [
  "embassy-crypto-aes128-ecb",
  "embassy-crypto-aes128-cmac",
  "embassy-crypto-p256-ecdh",
] }
rand_chacha = { version = "0.3", default-features = false, optional = true }
rtt-target = "0.6.2"
trouble-host = { features = ["gatt", "log"], version = "0.8.0", git = "https://github.com/embassy-rs/trouble.git", rev = "da44b34f67e1ee8efe977a5a975804b8b21962d4" }

critical-section = "1.2.0"
static_cell      = "2.1.1"
ergot = { git = "https://github.com/okhsunrog/ergot", rev = "f2b64cccbc6c8c2020c0ca82125ba38059181826", version = "0.12.0", default-features = false, features = ["embedded-io-async-v0_7", "nostd-seed-router", "embassy-time", "disable-cache-padding", "log-internal"] }
mutex = "1.0.2"
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
postcard-schema = "0.2.5"
embassy-futures = "0.1.2"
bbqueue = "0.7"
heapless = { version = "0.9", default-features = false }
oxifoc-core = { version = "0.1.0", path = "../oxifoc-core", default-features = false, features = ["icd", "spi-link"] }
dap-rs = { git = "https://github.com/probe-rs/dap-rs", rev = "a867ca7b41547b24aaad52b913528575685a5df5", version = "0.2.0", optional = true }
embassy-net = { version = "=0.9.1", default-features = false, features = ["tcp", "dhcpv4", "medium-ethernet", "log"], optional = true }
riscv = { version = "=0.15.0", optional = true }
embedded-storage = { version = "0.3", default-features = false, optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
log = { version = "0.4.35", default-features = false }

[dev-dependencies]
embedded-test = { version = "0.7.3", features = [
  "log",
  "embassy-010",
  "external-executor",
] }

# TCP_MIN_RTO_MS; see ../vendor/smoltcp/PATCHES.md.
[patch.crates-io]
smoltcp = { path = "../vendor/smoltcp" }
esp-hal = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-rtos = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-radio = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-alloc = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-bootloader-esp-idf = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-config = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-hal-procmacros = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-metadata-generated = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-phy = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-radio-rtos-driver = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-riscv-rt = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-rom-sys = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }
esp-sync = { git = "https://github.com/okhsunrog/esp-hal.git", rev = "e4e2aa018cc2a386f437837d4210b739fecc63e0" }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

# Verbatim copy of the root [workspace.lints] tables (this crate is excluded
# from the workspace for its target/toolchain) — keep in sync with ../Cargo.toml.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"
# Firmware panic policy (matches the #![warn] block in oxifoc-core/src/lib.rs;
# deliberate fail-fast sites carry #[expect(..., reason = "...")]):
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
