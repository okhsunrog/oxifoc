[package]
edition      = "2024"
name         = "oxifoc-bridge"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "oxifoc-bridge"
path = "./src/bin/main.rs"
test = false
bench = false

[[test]]
harness = false
name    = "hello_test"

[lib]
test = false
bench = false

[dependencies]
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7b8b9a3a79cfb80d47cbaea38d44d735841ca8f0", features = ["defmt", "esp32c6", "unstable"] }

esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7b8b9a3a79cfb80d47cbaea38d44d735841ca8f0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7b8b9a3a79cfb80d47cbaea38d44d735841ca8f0", features = ["defmt", "esp32c6"] }

bt-hci = "0.8.0"
embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7b8b9a3a79cfb80d47cbaea38d44d735841ca8f0", features = ["defmt"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "7b8b9a3a79cfb80d47cbaea38d44d735841ca8f0", features = [
  "ble",
  "defmt",
  "esp-alloc",
  "esp32c6",
  "unstable",
] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
trouble-host = { git = "https://github.com/embassy-rs/trouble.git", rev = "dc15b9e09fd8e4ba031ec462c3bf2c972bda99f8", features = ["gatt"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
ergot = { git = "https://github.com/okhsunrog/ergot", rev = "8d7db27e030564a048eb16c90080ae6730d14e11", version = "0.12.0", default-features = false, features = ["embedded-io-async-v0_7", "nostd-seed-router", "embassy-time", "disable-cache-padding", "defmt-v1"] }
mutex = "1.0.2"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
postcard-schema = "0.2.5"
embassy-futures = "0.1.2"
bbqueue = "0.7"
heapless = { version = "0.9", default-features = false }
oxifoc-core = { version = "0.1.0", path = "../oxifoc-core", features = ["icd", "defmt"] }

[dev-dependencies]
embedded-test = { version = "0.7.0", features = [
  "defmt",
  "embassy",
  "external-executor",
] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

# Verbatim copy of the root [workspace.lints] tables (this crate is excluded
# from the workspace for its target/toolchain) — keep in sync with ../Cargo.toml.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"
# Firmware panic policy (matches the #![warn] block in oxifoc-core/src/lib.rs;
# deliberate fail-fast sites carry #[expect(..., reason = "...")]):
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
