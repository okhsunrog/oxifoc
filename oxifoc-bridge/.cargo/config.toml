[target.riscv32imac-unknown-none-elf]
runner = "probe-rs run --chip=esp32c5 --preverify --always-print-stacktrace --no-location"

[env]
TROUBLE_HOST_DEFAULT_PACKET_POOL_MTU = "512"
# Match the station driver's in-flight transmit budget in wifi.rs.
ESP_RADIO_CONFIG_WIFI_MAX_BURST_SIZE = "10"
# embassy-net counts the Ethernet header in the driver's MTU.
ESP_RADIO_CONFIG_WIFI_MTU = "1514"
# The Ergot TCP socket buffers about 90 ms of native-rate telemetry; a
# retransmission must not wait the RFC 6298 second. 50 ms stays above the
# host's 40 ms delayed acknowledgement.
SMOLTCP_TCP_MIN_RTO_MS = "50"

[build]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
  "-Z", "stack-protector=all",
]

target = "riscv32imac-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]
