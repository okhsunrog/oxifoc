[build]
target = "thumbv7em-none-eabihf"

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
linker = "flip-link"

[target.thumbv7em-none-eabihf]
runner = ["bash", "../scripts/probe_run_f405.sh"]
# Cortex-M4F: hardware single-precision FP, including q31 vcvt asm.
rustflags = ["-C", "target-feature=+vfp2sp"]

[unstable]
profile-rustflags = true

# Preserve specialization of the single-operation DRV8301 SPI transaction.
# See docs/experiments/spi-codegen/report.md for the measured MIR cutoff.
[profile.release.package.embassy-stm32]
rustflags = ["-Zinline-mir-hint-threshold=115"]

[env]
# Default to chatty defmt logs while bringup
DEFMT_LOG = "debug"
