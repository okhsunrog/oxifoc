[package]
name = "oxifoc-f405"
version = "0.1.0"
edition = "2024"
description = "STM32F405-based motor controller (Simple FOCer 2 / VESC hardware)"

[[bin]]
name = "oxifoc-f405"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["transport-usb"]
# USB bulk endpoints via embassy-usb; defmt over RTT for debugging.
transport-usb = ["ergot/embassy-usb-v0_6", "ergot/defmt-sink-rtt"]

[dependencies]
# Embassy + Cortex-M
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", features = ["stm32f405rg", "time-driver-tim2", "unstable-pac", "exti", "defmt"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", features = ["tick-hz-32_768"] }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", package = "embassy-usb" }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"

# Debugging and logging
defmt = "1.0.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Utilities
heapless = { version = "0.9.2", default-features = false }
mutex = "1.0.2"
static_cell = "2.1"
assign-resources = "0.5.0"

# Gate driver
drv8301-dd = { version = "0.2.0", features = ["defmt"] }
embedded-hal-bus = "0.3"

# Persistent configuration storage
sequential-storage = { version = "7.1", features = ["postcard", "defmt"] }
embedded-storage-async = "0.4"
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
postcard = "1.1"

# Local crates
oxifoc-core = { path = "../oxifoc-core", features = ["defmt", "runtime", "storage"] }
ergot = { git = "https://github.com/okhsunrog/ergot", branch = "embassy-usb-v0_6", default-features = false, features = [
    "embassy-usb-v0_6",
    "disable-cache-padding",
    "defmt-sink-rtt",
] }

[profile.dev]
debug = true
lto = "fat"
opt-level = 3
incremental = true

[profile.release]
debug = 2
lto = "fat"
opt-level = 3
incremental = true

[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-time-queue-utils = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260", package = "embassy-usb" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-usb-synopsys-otg = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy", rev = "5bc8260" }

[patch."https://github.com/jamesmunns/ergot"]
ergot = { git = "https://github.com/okhsunrog/ergot", branch = "embassy-usb-v0_6" }
cobs-acc = { git = "https://github.com/okhsunrog/ergot", branch = "embassy-usb-v0_6" }
