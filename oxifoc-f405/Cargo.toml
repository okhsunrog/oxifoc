[package]
name = "oxifoc-f405"
version = "0.1.0"
edition = "2024"
description = "STM32F405-based motor controller (Simple FOCer 2 / VESC hardware)"

[[bin]]
name = "oxifoc-f405"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "bridge-spi-probe"
path = "src/bin/bridge_spi_probe.rs"
required-features = ["bench-bridge-spi", "board-vesc6-mk5"]
test = false
bench = false

[[bin]]
name = "bridge-pin-probe"
path = "src/bin/bridge_pin_probe.rs"
required-features = ["bench-bridge-pins", "board-vesc6-mk5"]
test = false
bench = false

[features]
# Current controller: MK5 with the C5 SPI bridge and fixed telemetry.
# CF2 and diagnostic transports require an explicit feature selection.
default = ["transport-spi", "board-vesc6-mk5", "fast-telemetry"]
# Exactly one board feature must be enabled (compile_error in main.rs).
# Cheap FOCer 2 / Simple FOCer 2: DRV8301 on hardware SPI3, low-side shunts,
# amp gain 10 V/V.
board-cf2 = []
# Trampa VESC 6 MK5 layout and clones (Mini V6 MK5): DRV8301 on bit-bang SPI
# (SCK PC10 / MOSI PB4 / MISO PB3), in-line phase shunts, amp gain 20 V/V,
# shutdown latch PC5, current/phase filter enables PD2/PC13.
# See docs/hw/vesc6-mk5.md.
board-vesc6-mk5 = []
# Standalone connector continuity probe: no FOC, gate disabled.
bench-bridge-pins = []
bench-bridge-pins-rx = ["bench-bridge-pins"]
bench-bridge-spi = []
bench-spi-cs-request = ["bench-bridge-spi"]
# CPU-only FOC state in 64-KiB CCM. DMA buffers and the stack remain in SRAM.
ccm = []
# A/B placement of the ADC handler and major FOC callees in initialized SRAM.
ram-foc = ["oxifoc-core/ram-foc"]
# USB bulk endpoints via embassy-usb; defmt over RTT for debugging.
transport-usb = ["dep:embassy-usb", "ergot/embassy-usb-v0_6", "ergot/nostd-seed-router"]
transport-spi = ["oxifoc-core/spi-link"]
# Cooperative task classes: USB workers 3, protocol 2, telemetry/detection 1,
# remaining tasks 0. Complements the default USB interrupt executor.
task-priority = ["embassy-executor/scheduler-priority"]
# Detailed per-section DWT profiling; keep out of normal control images.
isr-profiling = ["isr-timing", "oxifoc-core/isr-profiling"]
# Two DWT reads per ISR, without nested section instrumentation.
isr-timing = []
# Finite active-body/entry-gap histograms, exported after Stop over SWD.
bench-foc-distribution = ["isr-timing"]
bench-foc-deadline = ["bench-foc-distribution"]
# One complete steady active section window in RAM; no periodic reporter I/O.
bench-foc-sections-ram = ["bench-foc-distribution"]
bench-foc-phase-ram = ["bench-foc-sections-ram", "oxifoc-core/isr-profile-phase"]
# Exhaustive host-table/MCU temperature-model agreement before PWM setup.
bench-ntc-check = []
# Finite ADC-owned records of the first and longest over-budget cycles.
bench-cycle-outliers = ["isr-profiling", "bench-clock-reference"]
# A/B reproduction of the former periodic observer log inside ADC.
bench-observer-logging = ["oxifoc-core/observer-logging"]
# Finite Stopped-only CPU comparison; no transport I/O inside timed regions.
bench-raw-codec = ["transport-usb", "isr-timing", "bench-clock-reference"]
# ergot over RTT channel 1 (defmt shares ch0). Diagnostic transport — high-rate
# telemetry over the debug probe; adds a diagnostic interface alongside USB.
transport-rtt = ["ergot/rtt", "ergot/nostd-seed-router"]
# Bench CPU/transport qualification: calculate active FOC but never enable
# phase outputs. Default-off; do not use for motor measurements.
bench-no-phase-outputs = []
# Device-specific, motor-inhibited clock qualification; never a production default.
bench-overclock = ["bench-calibrated-clock", "bench-no-phase-outputs", "isr-timing", "embassy-stm32/unchecked-overclocking"]
# Keep sparse integrity/temperature checks, without saturating spare CPU.
bench-overclock-light = ["bench-overclock"]
# Frequency measurement with motor phase A disconnected: permit only leg A.
# Use DirectVoltage=0 for 50% PWM; Stop and faults still disable everything.
bench-only-phase-a = []
# A/B qualification: disable command-voltage correction, retaining gate deadtime.
bench-no-deadtime-comp = []
# RAM-only task/ADC timeline, armed and read over SWD after a capture.
bench-executor-trace = ["embassy-executor/trace"]
# Observe CCR commit timing without any pre-commit ADC or executor trace hooks.
bench-pwm-commit = ["bench-clock-reference"]
# NetStack selected-policy callback spans and earliest ADC PWM phase, without executor hooks.
bench-netstack-trace = ["bench-clock-reference"]
# A/B qualification only: restore the previous all-IRQ NetStack masking policy.
bench-netstack-primask = ["bench-netstack-trace"]
# Trigger the finite trace at the first voltage-excitation packet, after lock.
bench-trace-excitation = ["bench-executor-trace"]
# Compare an independent free-running APB timer, DWT and received USB SOFs.
bench-clock-reference = []
# A/B qualification only: keep all USB handlers on the thread executor.
bench-usb-thread = []
# Endpoint-write timing for streaming fault isolation, absent from normal builds.
bench-usb-metrics = ["transport-usb", "bench-clock-reference"]
# Low-rate, ADC-sequence-correlated Hall observations during motor bring-up.
bench-hall = []
# Finite ADC-side Hall/observer handoff evidence; opt in separately from edges.
bench-hall-phase = ["bench-hall"]
bench-hall-crossover = ["bench-hall-phase", "oxifoc-core/bench-phase-observation"]
bench-spi-pump-priority = ["task-priority"]
# Production fixed Packed28 sessions over the selected Ergot interface.
fast-telemetry = ["task-priority", "oxifoc-core/fast-telemetry"]
# Alternative carriers/codecs are explicit diagnostics, mutually exclusive
# with the production publisher. Commands stay on Ergot.
bench-raw-usb = ["transport-usb", "task-priority", "oxifoc-core/bench-raw-stream"]
bench-raw-rtt = ["transport-usb", "task-priority", "oxifoc-core/bench-raw-stream"]
bench-raw-ergot = ["fast-telemetry", "oxifoc-core/diagnostic-telemetry-codecs"]
# Compatibility alias for earlier benchmark commands.
bench-scheduler-priority = ["task-priority"]
# Bench EDF policy: fresh relative deadlines on actual ready/enqueue events.
bench-scheduler-deadline = ["embassy-executor/scheduler-deadline", "bench-executor-trace"]
# Temporary calibration for UUID 2B002C001047343031363330 only; never a board default.
bench-calibrated-clock = []
# Observer-internals fast-frame mapping (erpm<-PLL, vd<-frame gap,
# vq<-readiness err signed by trust; see oxifoc-core `obs-debug-telem`).
# Debug builds only.
obs-debug-telem = ["oxifoc-core/obs-debug-telem"]

[dependencies]
# Embassy + Cortex-M
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-futures = { version = "0.1.2", features = ["defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-stm32 = { version = "0.6.0", features = ["stm32f405rg", "time-driver-tim2", "unstable-pac", "exti", "defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-sync = { version = "0.8.0", features = ["defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768", "defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-usb = { version = "0.6.0", features = ["defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93", optional = true }

cortex-m = { version = "0.7.8", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.6"
critical-section = "1.2"

# Debugging and logging
defmt = "1.1.1"

# Utilities
heapless = { version = "0.9.3", default-features = false, features = ["defmt"] }
mutex = "1.0.2"
static_cell = "2.1"
assign-resources = "0.5.0"

# Gate driver
drv8301-dd = { version = "0.3.0", features = ["defmt"] }
embedded-hal-bus = "0.3"

# Persistent configuration storage
sequential-storage = { version = "8.0", features = ["postcard", "defmt"] }
embedded-storage-async = "0.4"
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
postcard = { version = "1.1", features = ["use-defmt"] }

# Local crates
oxifoc-core = { path = "../oxifoc-core", features = ["defmt", "runtime", "storage", "embassy", "embassy-hal", "delivery", "hfi", "hfi-detect", "isr-speed"] }
ergot = { git = "https://github.com/okhsunrog/ergot", rev = "3c502f49814ac2ae25385b21fdbc9b964f86d877", default-features = false, features = [
    "embedded-io-async-v0_7",
    "embassy-time",
    "disable-cache-padding",
    "defmt-sink-rtt",
    "defmt-sink-network",
] }
rtt-target = "0.6"
libm = "0.2.16"
serde = { version = "1.0.229", default-features = false }
embedded-hal = "1.0.0"
bitbang-hal-ng = { version = "0.5.0", features = ["cortex-m"] }

# Keep Embassy types used through ergot on the same main-branch revision as
# embassy-stm32.
[patch.crates-io]
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", rev = "98d847be57f3ea022ce05fe9b95ab3639a1e0a93" }

[profile.dev]
debug = true
lto = "fat"
opt-level = 3
incremental = true

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = true

# Verbatim copy of the root [workspace.lints] tables (this crate is excluded
# from the workspace for its target/toolchain) — keep in sync with ../Cargo.toml.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"
# Firmware panic policy (matches the #![warn] block in oxifoc-core/src/lib.rs;
# deliberate fail-fast sites carry #[expect(..., reason = "...")]):
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"

[build-dependencies]
oxifoc-core = { version = "0.1.0", path = "../oxifoc-core", default-features = false, features = ["algorithms"] }
