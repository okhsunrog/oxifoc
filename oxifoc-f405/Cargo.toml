[package]
name = "oxifoc-f405"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "STM32F405-based motor controller (Simple FOCer 2 / VESC hardware)"

[[bin]]
name = "oxifoc-f405"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "bridge-spi-probe"
path = "src/bin/bridge_spi_probe.rs"
required-features = ["bench-bridge-spi", "board-vesc6-mk5"]
test = false
bench = false

[[bin]]
name = "bridge-pin-probe"
path = "src/bin/bridge_pin_probe.rs"
required-features = ["bench-bridge-pins", "board-vesc6-mk5"]
test = false
bench = false

[features]
# Current controller: MK5 with the C5 SPI bridge and fixed telemetry.
# CF2 and diagnostic transports require an explicit feature selection.
default = ["transport-spi", "board-vesc6-mk5"]
# Exactly one board feature must be enabled (compile_error in main.rs).
# Cheap FOCer 2 / Simple FOCer 2: DRV8301 on hardware SPI3, low-side shunts,
# amp gain 10 V/V.
board-cf2 = []
# Trampa VESC 6 MK5 layout and clones (Mini V6 MK5): DRV8301 on bit-bang SPI
# (SCK PC10 / MOSI PB4 / MISO PB3), in-line phase shunts, amp gain 20 V/V,
# shutdown latch PC5, current/phase filter enables PD2/PC13.
# See docs/hw/vesc6-mk5.md.
board-vesc6-mk5 = ["dep:bitbang-hal-ng", "oxifoc-core/compact-foc", "oxifoc-core/atan2-fma", "velocity-debug"]
# Velocity-loop debug records from the ADC ISR into raw sessions
# (VelocityDebugArmEndpoint). Part of every MK5 image; CF2 omits it.
velocity-debug = ["oxifoc-core/velocity-debug"]
# Standalone connector continuity probe: no FOC, gate disabled.
bench-bridge-pins = []
bench-bridge-pins-rx = ["bench-bridge-pins"]
bench-bridge-spi = []
bench-spi-cs-request = ["bench-bridge-spi"]
# USB bulk endpoints via embassy-usb; defmt over RTT for debugging.
transport-usb = ["dep:embassy-usb", "ergot/embassy-usb-v0_7-preview", "ergot/nostd-seed-router"]
transport-spi = ["oxifoc-core/spi-link"]
# Detailed per-section DWT profiling; keep out of normal control images.
isr-profiling = ["oxifoc-core/isr-profiling"]
# Hall crossover tuning evidence: finite Hall edge, Hall/observer handoff,
# velocity-loop, crossover and fault records read over SWD after Stop
# (scripts/bench_hall_edges.py), plus a 50-Hz Hall log while driving.
hall-diagnostics = ["oxifoc-core/hall-diagnostics"]

[dependencies]
# Embassy + Cortex-M
# scheduler-priority: cooperative task classes. USB workers 3, protocol and
# ISR stats 2, telemetry/detection 1, remaining tasks 0. Complements the USB
# interrupt executor.
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "scheduler-priority", "defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }
embassy-futures = { version = "0.1.2", features = ["defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }
embassy-stm32 = { version = "0.6.0", features = ["stm32f405rg", "time-driver-tim2", "unstable-pac", "exti", "defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }
embassy-sync = { version = "0.8.0", features = ["defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768", "defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }
embassy-usb = { version = "0.6.0", default-features = false, features = ["device", "defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8", optional = true }

cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
critical-section = "1.2"

# Debugging and logging
defmt = "1.2.0"

# Utilities
heapless = { version = "0.9.3", default-features = false, features = ["defmt"] }
mutex = "1.0.2"
static_cell = "2.1"
assign-resources = "0.5.0"

# Gate driver
drv8301-dd = { version = "0.3.0", features = ["defmt"] }
embedded-hal-bus = "0.3"

# Persistent configuration storage
sequential-storage = { version = "8.0", features = ["postcard", "defmt"] }
embedded-storage-async = "0.4"
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"], git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }
postcard = { version = "1.1", features = ["use-defmt"] }

# Local crates
# Core features are listed in full: this crate's own features must decide
# what the image contains, never oxifoc-core's defaults.
oxifoc-core = { path = "../oxifoc-core", default-features = false, features = [
    "algorithms", "detection", "offset-diagnostics", "ccm-telemetry",
    "defmt", "runtime", "storage", "embassy", "embassy-hal", "delivery", "hfi", "hfi-detect", "isr-speed",
] }
ergot = { git = "https://github.com/okhsunrog/ergot", rev = "9cc0c05db97e88e9e10e847f289d68686148c0d0", version = "0.12.0", default-features = false, features = [
    "embedded-io-async-v0_7",
    "embassy-time",
    "disable-cache-padding",
    "defmt-v1",
] }
libm = "0.2.16"
serde = { version = "1.0.229", default-features = false }
embedded-hal = "1.0.0"
bitbang-hal-ng = { version = "0.5.0", features = ["cortex-m"], optional = true }
rtt-target = { version = "0.6", default-features = false }
bbqueue = { version = "0.7", default-features = false, features = ["maitake-sync-0_3", "disable-cache-padding"] }

# Keep Embassy types used through ergot on the same main-branch revision as
# embassy-stm32.
[patch.crates-io]
rtt-target = { path = "../vendor/rtt-target" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }
# ergot builds its embassy-usb 0.6 adapter for the unreleased API
# (`embassy-usb-v0_7-preview`) and takes the crate from here.
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", rev = "72f7affbdcddb9fdcf3fdcaff72c5dbc8b0be6b8" }

[profile.dev]
debug = true
lto = "fat"
opt-level = 3
incremental = true

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = 3
# Nonincremental codegen has lower measured ADC ISR latency on the MK5.
incremental = false

# Verbatim copy of the root [workspace.lints] tables (this crate is excluded
# from the workspace for its target/toolchain) — keep in sync with ../Cargo.toml.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"
# Firmware panic policy (matches the #![warn] block in oxifoc-core/src/lib.rs;
# deliberate fail-fast sites carry #[expect(..., reason = "...")]):
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"

[build-dependencies]
oxifoc-core = { version = "0.1.0", path = "../oxifoc-core", default-features = false, features = ["algorithms"] }
