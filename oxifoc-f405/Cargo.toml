[package]
name = "oxifoc-f405"
version = "0.1.0"
edition = "2024"
description = "STM32F405-based motor controller (Simple FOCer 2 / VESC hardware)"

[[bin]]
name = "oxifoc-f405"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["transport-usb", "transport-uart", "board-cf2"]
# Exactly one board feature must be enabled (compile_error in main.rs).
# Cheap FOCer 2 / Simple FOCer 2: DRV8301 on hardware SPI3, low-side shunts,
# amp gain 10 V/V.
board-cf2 = []
# Trampa VESC 6 MK5 layout and clones (Mini V6 MK5): DRV8301 on bit-bang SPI
# (SCK PC10 / MOSI PB4 / MISO PB3), in-line phase shunts, amp gain 20 V/V,
# shutdown latch PC5, current/phase filter enables PD2/PC13.
# See docs/hw/vesc6-mk5.md.
board-vesc6-mk5 = []
# USB bulk endpoints via embassy-usb; defmt over RTT for debugging.
transport-usb = []
# UART on USART3 (PB10 TX / PB11 RX) for Cheap FOCer 2
transport-uart = []
# ergot over RTT channel 1 (defmt shares ch0). Diagnostic transport — high-rate
# telemetry over the debug probe; adds a third interface alongside USB/UART.
transport-rtt = ["ergot/rtt"]
# Observer-internals fast-frame mapping (erpm<-PLL, vd<-frame gap,
# vq<-readiness err signed by trust; see oxifoc-core `obs-debug-telem`).
# Debug builds only.
obs-debug-telem = ["oxifoc-core/obs-debug-telem"]

[dependencies]
# RTIC executor (port experiment — replaces embassy-executor; embassy-time
# and the embassy-stm32 HAL stay, see docs/notes/rtic-port-experiment.md)
rtic = { version = "2.3", features = ["thumbv7-backend"] }

# Embassy + Cortex-M. NOTE: no `time-driver-*` feature on embassy-stm32 —
# the embassy-time driver is provided by src/time.rs, bridged onto the same
# TIM5 monotonic that rtic-monotonics runs (single hardware timebase; TIM2
# is free again). embassy-time itself stays only for ergot's unconditional
# uses (router Instants, seed-router lease, USB transport liveness).
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f405rg", "unstable-pac", "exti", "defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
# tick-hz matches the TIM5 monotonic (1 MHz) so driver tick conversion is
# identity — src/time.rs const-asserts this.
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000", "defmt"] }
# The bridge driver's trait + its (instant, waker) queue. 64 entries bounds
# concurrently pending embassy-time timers (ergot only — app timers run on
# rtic-time's intrusive queue and have no bound).
embassy-time-driver = "0.2"
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"

# Debugging and logging
defmt = "1.0.1"

# Utilities
heapless = { version = "0.9.2", default-features = false, features = ["defmt"] }
mutex = "1.0.2"
static_cell = "2.1"
assign-resources = "0.5.0"
embedded-io-async = { version = "0.7", features = ["defmt"] }

# Gate driver
drv8301-dd = { version = "0.2.0", features = ["defmt"] }
embedded-hal-bus = "0.3"

# Persistent configuration storage
sequential-storage = { version = "7.1", features = ["postcard", "defmt"] }
embedded-storage-async = "0.4"
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
postcard = { version = "1.1", features = ["use-defmt"] }

# Local crates
oxifoc-core = { path = "../oxifoc-core", features = ["defmt", "runtime", "storage", "embassy", "embassy-hal", "delivery", "hfi", "hfi-detect", "isr-speed", "isr-profiling"] }
# NOTE (RTIC branch): ergot's `embassy-time` feature is dropped — it gated
# the eio (UART/RTT) liveness timeout machinery. UART link-loss detection is
# therefore GONE on this branch (the ISR-side command-staleness deadman
# failsafe is unaffected, and USB liveness is unconditional in ergot).
# ergot still uses embassy-time unconditionally in the USB transport
# (per-frame Instant::now), the router lease bookkeeping, and the
# seed-router service — see docs/notes/rtic-port-experiment.md.
ergot = { git = "https://github.com/okhsunrog/ergot", rev = "8d7db27e030564a048eb16c90080ae6730d14e11", default-features = false, features = [
    "embassy-usb-v0_6",
    "embedded-io-async-v0_7",
    "nostd-seed-router",
    "disable-cache-padding",
    "defmt-sink-rtt",
    "defmt-sink-network",
] }
rtt-target = "0.6"
libm = "0.2.16"
serde = { version = "1.0.228", default-features = false }
embedded-hal = "1.0.0"
bitbang-hal-ng = { version = "0.5.0", features = ["cortex-m"] }
# App timebase: TIM5 monotonic @ 1 MHz (src/time.rs). Shares stm32-metapac
# with embassy-stm32 (same major), so no PAC duplication.
rtic-monotonics = { version = "2.2", features = ["stm32f405rg", "stm32_tim5"] }

[profile.dev]
debug = true
lto = "fat"
opt-level = 3
incremental = true

[profile.release]
debug = 2
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = true

# Verbatim copy of the root [workspace.lints] tables (this crate is excluded
# from the workspace for its target/toolchain) — keep in sync with ../Cargo.toml.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
use_self = "warn"
uninlined_format_args = "warn"
cast_lossless = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
# Failure-class guardrails (all zero-hit when introduced; cheap insurance):
dbg_macro = "warn"
string_slice = "warn"
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
unused_result_ok = "warn"
iter_not_returning_iterator = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
lossy_float_literal = "warn"
unused_async = "warn"
# Firmware panic policy (matches the #![warn] block in oxifoc-core/src/lib.rs;
# deliberate fail-fast sites carry #[expect(..., reason = "...")]):
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"
