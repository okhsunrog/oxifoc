[package]
name = "oxifoc-f405"
version = "0.1.0"
edition = "2024"
description = "STM32F405-based motor controller (Simple FOCer 2 / VESC hardware)"

[[bin]]
name = "oxifoc-f405"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["transport-usb", "transport-uart"]
# USB bulk endpoints via embassy-usb; defmt over RTT for debugging.
transport-usb = []
# UART on USART3 (PB10 TX / PB11 RX) for Cheap FOCer 2
transport-uart = []

[dependencies]
# Embassy + Cortex-M
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-futures = { version = "0.1.2" }
embassy-stm32 = { version = "0.6.0", features = ["stm32f405rg", "time-driver-tim2", "unstable-pac", "exti", "defmt"] }
embassy-sync = { version = "0.8.0" }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
embassy-usb = { version = "0.6.0" }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
critical-section = "1.2"

# Debugging and logging
defmt = "1.0.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# Utilities
heapless = { version = "0.9.2", default-features = false }
mutex = "1.0.2"
static_cell = "2.1"
assign-resources = "0.5.0"
embedded-io-async = "0.7"

# Gate driver
drv8301-dd = { version = "0.2.0", features = ["defmt"] }
embedded-hal-bus = "0.3"

# Persistent configuration storage
sequential-storage = { version = "7.1", features = ["postcard", "defmt"] }
embedded-storage-async = "0.4"
embassy-embedded-hal = { version = "0.6.0" }
postcard = "1.1"

# Local crates
oxifoc-core = { path = "../oxifoc-core", features = ["defmt", "runtime", "storage", "embassy", "embassy-hal", "delivery"] }
ergot = { git = "https://github.com/okhsunrog/ergot", branch = "link-local-addressing", default-features = false, features = [
    "embassy-usb-v0_6",
    "embedded-io-async-v0_7",
    "nostd-seed-router",
    "embassy-time",
    "disable-cache-padding",
    "defmt-sink-rtt",
    "defmt-sink-network",
] }
rtt-target = "0.6"
libm = "0.2.16"
serde = { version = "1.0.228", default-features = false }

[profile.dev]
debug = true
lto = "fat"
opt-level = 3
incremental = true

[profile.release]
debug = 2
lto = "fat"
opt-level = 3
incremental = true
